cameras:
- name: NEX-5R
  protocol: mtp
  usb_pid: 0946
- name: ZV-E10
  protocol: mtp
  usb_pid: 0D4A
- name: A7R III
  protocol: mtp
  usb_pid: 0C00
destination:
  base_path: D:/Photos/CameraConnect
  photo_template: '{yyyy}/{yyyy}-{mm}-{dd}'
  video_template: Video
file_types:
  photos:
  - ARW
  - JPG
  - JPEG
  - HEIF
  videos:
  - MP4
  - MTS
  - AVCHD
general:
  delete_after_sync: false
  minimize_to_tray: false
  overwrite_existing: true
  poll_interval: 3
  scan_mode: once
  start_with_windows: false
  sync_mode: copy
google_drive:
  enabled: false
  folder_id: ''
nas:
  enabled: false
  server: ''
  share: ''
notifications:
  on_camera_connect: true
  on_copy_complete: batch
  play_sound: true
